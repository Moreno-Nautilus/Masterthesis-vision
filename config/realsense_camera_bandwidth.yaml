# RealSense camera parameters for bandwidth optimization.
# Resolution set to 640x480 (QVGA) as requested.
# Frame rate reduced to 15 FPS for lower bandwidth.
# Use with: ros2 launch realsense2_camera rs_launch.py param_file:=$(pwd)/config/realsense_camera_bandwidth.yaml

/**:
  ros__parameters:
    camera_name: realsense

    # RGB stream parameters
    rgb_camera:
      profile: 640x480x15  # 640x480 resolution at 15 FPS
      format: RGB8
      # Hardware encoding: none=raw (higher bandwidth), mjpeg/h264=compressed (lower bandwidth)
      # Use hardware_format for H.264 if the camera model supports it
      # For D435i/D455: only mjpeg is available in hardware
      info_update_base_url: ""
      trigger_camera: false

    # Depth stream parameters
    depth_camera:
      profile: 640x480x15  # Match RGB resolution/FPS for sync
      format: Z16

    # Stereo depth module (depth processing)
    stereo_depth:
      # Depth preset: 0=Default, 1=Hand, 2=High Density, 3=Medium Density, 4=Medium Density (Prefer Min Weight)
      # Use 0 (Default) for most balanced performance, 4 for lower compute/bandwidth
      preset: 0

    # Accelerometer/Gyroscope (if present)
    enable_accel: false
    enable_gyro: false
    enable_pose: false

    # Depth filtering (reduce data before transmission)
    enable_decimation_filter: true
    decimation_filter:
      magnitude: 2  # Reduce spatial resolution by 2x

    enable_spatial_filter: false  # Smooth depth, can slow down processing
    enable_temporal_filter: false  # Time-based filtering, adds latency

    # Auto-exposure settings (stable image, moderate bandwidth impact)
    auto_exposure_mode: 0
    auto_white_balance_mode: 0

# Additional notes:
# - Reduce resolution from 1280x720 to 640x480 (4x pixel reduction = ~75% bandwidth savings)
# - Reduce FPS from 30 to 15 (50% bandwidth savings)
# - Combined: ~87% bandwidth reduction for video streams
# - Enable decimation filter to reduce depth map size in post-processing
# - Disable IMU streams (accel/gyro) if not used
# - Consider image compression: image_transport package can add JPEG compression at the ROS level
