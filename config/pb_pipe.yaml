# pb_pipe - Cylindrical pipe
# Dimensions: ~43 x 80 x 50 mm (diameter x length x height when standing)
# Grasp strategy: Top-down, grip across the 43mm diameter

object_name: "pb_pipe"
object_diameter_m: 0.043

# Pose topic (adjust camera/index as needed)
input_pose_topic: "/perception/fp/pose_base/zed2i_2/pb_pipe_0"

# Gripper settings - "always close" strategy
gripper_grasp_width: 0.001
gripper_grasp_force: 20.0
gripper_grasp_speed: 0.03
gripper_epsilon_inner: 0.001
gripper_epsilon_outer: 0.08

# Centroid offset (CAD center to grasp point)
centroid_offset_x: 0.0
centroid_offset_y: 0.0
centroid_offset_z: 0.0

# Clearances (top-down approach)
pregrasp_clearance_m: 0.10
grasp_clearance_m: 0.025

# End-effector orientation (top-down, gripper fingers along Y)
roll: 3.14159265
pitch: 0.0
yaw: 1.57079633

# Lift height after grasp
lift_delta_z_m: 0.08