  - -0.15541365087829384
  - 0.09716745626870306
  - -0.1790583561869697
  - 0.7010643749690525
  - -0.6902512928121703
  - 0.03915383144305058
  - -0.6959564205249723
  - -0.7170157865859002
  t:
