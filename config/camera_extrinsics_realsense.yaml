# Extrinsics for the 1-ZED + 2-RealSense trio pipeline.
#
# LAYOUT (every entry below, for all cam_ids):
#   R: [r00,r01,r02, r10,r11,r12, r20,r21,r22]   # 3x3 rotation, flattened ROW-MAJOR (not column-major)
#   t: [tx,ty,tz]                                 # meters
# Convention: p_dst = R @ p_cam + t  (R/t map points from the camera's
# optical frame into "dst"; "dst" differs by entry, see below).
# See src/calibration/io_extrinsics.py (load/save_extrinsics_yaml) for the
# code that reads/writes this exact layout.
#
# zed2i_1 keeps the normal meaning: a STATIC camera-to-base transform,
# copied as-is from config/camera_extrinsics_base.yaml. "base" here is the
# active robot's lbr_link_0 frame (see config/robot_bases.yaml:
# active_robot -- currently robot_b), i.e. dst = lbr_link_0.
#
# realsense_1 / realsense_2 mean something different: they are mounted on
# the robot end-effector, so they move with the arm. For these two entries,
# R/t describe the STATIC camera-to-flange offset (the fixed mechanical
# mount transform), NOT a camera-to-base transform -- dst = lbr_link_ee of
# that same active robot. At runtime the pipeline composes this offset with
# the live flange pose (subscribed from a PoseStamped topic, see
# --flange-pose-topic) to get the current camera-to-base extrinsic every
# frame:
#
#   T_base_cam(t) = T_base_flange(t) @ T_flange_cam
#
# PLACEHOLDER VALUE: realsense_1 below is still pure identity (camera optical
# frame == flange frame, no offset at all) -- not yet hand-eye calibrated.
# realsense_2 has a real online hand-eye calibration. Replace realsense_1's
# R/t with its real hand-eye calibration (camera optical frame relative to
# the flange frame, lbr_link_ee) before trusting any fused pose from it --
# identity is almost certainly wrong, it's a placeholder so the pipeline can
# run end-to-end before calibration exists.
#
# RealSense USB serial numbers (for zed_realsense_trio.launch.py
# rs1_serial:=/rs2_serial:=), recorded here for convenience:
#   realsense_1: 260322275185
#   realsense_2: 260522275434
#
# realsense_nominal and realsense_2_initial_guess_cad both hold the SAME
# CAD-derived (not hand-eye calibrated) camera-to-flange offset for the
# RealSense mount, just consumed by different code under different names:
#   - realsense_nominal: read by calibrate_handeye.py / the joint_handeye_calib
#     bundle-adjustment package as the CAD prior for its solver.
#   - realsense_2_initial_guess_cad: NOT a cam_id read by any loader -- it's
#     swapped in for "realsense_2" by publish_extrinsics_tf.py's default
#     --realsense2-source cad_initial_guess, so the CAD guess can be
#     sanity-checked against the gripper/robot in RViz, or diffed by eye
#     against the actual calibrated realsense_2 entry below (they currently
#     differ by ~141 deg of rotation and ~39mm of translation -- see git
#     history for the full derivation).
# Neither is consumed by the tracking pipeline (run_pipeline_track_multicam_
# realsense.py only looks up "realsense_1"/"realsense_2" by name).

