# pb_top - Flat disc/cap shape
# Dimensions: ~100 x 40 x 26 mm (wide x narrow x height)
# Grasp strategy: Top-down, grip across the 40mm narrow dimension

object_name: "pb_top"
object_diameter_m: 0.040

# Pose topic
input_pose_topic: "/perception/fp/pose_base/zed2i_2/pb_top_0"

# Gripper settings - "always close" strategy
gripper_grasp_width: 0.001
gripper_grasp_force: 20.0
gripper_grasp_speed: 0.03
gripper_epsilon_inner: 0.001
gripper_epsilon_outer: 0.08

# Centroid offset
centroid_offset_x: 0.0
centroid_offset_y: 0.0
centroid_offset_z: 0.0

# Clearances
pregrasp_clearance_m: 0.08
grasp_clearance_m: 0.015

# End-effector orientation (top-down)
roll: 3.14159265
pitch: 0.0
yaw: 0.0

# Lift height
lift_delta_z_m: 0.06